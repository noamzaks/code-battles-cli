[project]
name = "code-battles-cli"
version = "1.2.1"
description = "A CLI for competitors in any Code Battles event!"
dependencies = [
    "requests>=2.32.3",
    "google-cloud-firestore>=2.19.0",
    "rich>=13.9.3",
    "click>=8.1.7",
]
readme = "README.md"
requires-python = ">= 3.8"

[project.scripts]
"code-battles" = "code_battles_cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "ruff>=0.16.10",
]

[tool.mypy]
untyped_calls_exclude = "google"

[tool.ruff]
lint.ignore = ["LOG015"]
