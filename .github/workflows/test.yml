name: Test
on: [push]
jobs:
    test:
        name: Test
        strategy:
            matrix:
                version: ["3.8", "3.12"]
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Clone the repository
              uses: actions/checkout@v6
            - name: Install uv with all available options
              uses: astral-sh/setup-uv@v10.1.0
            - name: Sync uv
              run: uv sync
            - name: Run tests
              run: uv run pytest
